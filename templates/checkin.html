<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check-in — Votação Local</title>
  <!-- Tema global: theme.js aplica data-theme no <head> para evitar FOUC. -->
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/checkin.css') }}" />
</head>
<body>
  <h1>Check-in de Eleitor 🪪</h1>
  <p class="lede">Aproxime o crachá do leitor NFC. O número é lido automaticamente.</p>

  <div class="panel">
    <label for="badge">Crachá (leitor NFC)</label>
    <input id="badge" type="text" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="Aguardando leitura..." autofocus />

    <div id="booth-banner" class="booth-banner" role="status" aria-live="assertive">
      <div class="cap">Dirija-se à</div>
      <div class="num" id="booth-number">—</div>
      <div class="sub" id="booth-sub"></div>
    </div>

    <div id="status" class="status info" role="status" aria-live="polite">
      <span class="dot"></span>
      <span><span class="msg">Pronto para leitura</span><small id="sub">Aproxime o crachá do leitor.</small></span>
    </div>

    <div class="meta">
      <div>Liberados para votar<b id="tokens">–</b></div>
      <div>Crachá atual<b id="badge-view">–</b></div>
      <div>Fila de espera<b id="queue-hint">–</b></div>
    </div>

    <div class="cooldown-bar"><i id="progress"></i></div>
  </div>

  <footer>Cooldown anti duplo-swap: <b id="cooldown-label">{{ cooldown }}</b>s ·
    <a href="{{ url_for('painel_tv_page') }}">Painel TV</a> ·
    <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">🔊 Som</button>
    <button id="theme-toggle" class="sound-toggle" type="button">🌙 Tema</button></footer>


  <script>
    // Configuração vinda do servidor (Jinja).
    window.VOTACAO_COOLDOWN = {{ cooldown }};
  </script>
  <script src="{{ url_for('static', filename='js/checkin.js') }}"></script>
</body>
</html>
