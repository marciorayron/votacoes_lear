<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cabine de Votação</title>
  <!-- Tema global: theme.js aplica data-theme no <head> para evitar FOUC. -->
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cabine.css') }}" />
</head>
<body>
  <header>
    <h1 id="title">Cabine de Votação</h1>
  </header>

  <main>
    <!-- Espera -->
    <section id="screen-wait" class="screen active">
      <div class="pulse">🗳️</div>
      <div class="wait-title" id="wait-title">Aguardando liberação</div>
      <div class="wait-sub" id="wait-sub">Faça o check-in na mesa para liberar a cabine.</div>
      <div class="status-badge"><span id="wait-dot" class="dot"></span><span id="wait-status">Conectando…</span></div>
    </section>

    <!-- Voto -->
    <section id="screen-vote" class="screen">
      <h2 class="question" id="question">…</h2>
      <div class="options" id="options"></div>
      <div class="actions">
        <button class="btn cancel" id="cancel-btn">Cancelar</button>
        <button class="btn confirm" id="confirm-btn" disabled>Confirmar voto</button>
      </div>
    </section>

    <!-- Resultado -->
    <section id="screen-done" class="screen">
      <div class="result-icon" id="done-icon">✅</div>

      <div class="result-title" id="done-title">Voto registrado!</div>
      <div class="result-sub" id="done-sub">Obrigado por participar.</div>
    </section>

    <!-- Pareamento (cabine ainda nao registrada) -->
    <section id="screen-pair" class="screen">
      <div class="pulse">🔗</div>
      <div class="wait-title">Cabine não pareada</div>
      <div class="wait-sub">Digite o <b>PIN de pareamento</b> exibido no painel administrativo.</div>
      <input id="pair-input" class="pair-input" type="text" inputmode="numeric"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="PIN" maxlength="16" />
      <div class="wait-sub" id="pair-msg"></div>
      <div class="actions">
        <button class="btn confirm" id="pair-btn">Parear cabine</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="status-badge"><span id="foot-dot" class="dot"></span><span id="foot-status">online</span></div>
    <button id="theme-toggle" class="theme-chip" type="button">🌙 Tema</button>
  </footer>
  <script src="{{ url_for('static', filename='js/cabine.js') }}"></script>
</body>
</html>
